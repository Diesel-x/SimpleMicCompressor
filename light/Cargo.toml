[package]
name = "simple-mic-compressor-light"
version = "1.2.0"
edition = "2021"
authors = ["Diesel-X <https://github.com/Diesel-x/SimpleMicCompressor>"]
description = "SimpleMicCompressor (Light) v1.2 by Diesel-X - Ultra-lightweight background mic compressor (~3-5 MB RAM, 0% CPU)"
repository = "https://github.com/Diesel-x/SimpleMicCompressor"
license = "MIT"

[[bin]]
name = "SimpleMicCompressor_Light"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
ringbuf = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
